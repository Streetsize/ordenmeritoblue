<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Residencias Médicas</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 600px; 
            margin: 2rem auto; 
            padding: 1rem; 
            background-color: #f9f9f9; 
            color: #333;
        }
        .container { 
            background: white; 
            padding: 2rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h2 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 1.5rem;
        }
        .form-group { 
            margin-bottom: 1.5rem; 
        }
        label { 
            display: block; 
            margin-bottom: 0.5rem; 
            font-weight: bold; 
        }
        input[type="text"], select { 
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 1rem;
        }
        .checkbox-group { 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            background: #f1f8ff;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid #cce5ff;
        }
        .checkbox-group input { 
            width: auto; 
            margin: 0; 
            transform: scale(1.2);
        }
        button { 
            width: 100%; 
            padding: 1rem; 
            background: #0056b3; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 1.1rem; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.3s; 
        }
        button:hover { 
            background: #004494; 
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }
        #resultado { 
            margin-top: 1.5rem; 
            padding: 1.5rem; 
            border-radius: 4px; 
            display: none; 
            text-align: center;
        }
        .success { 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
        }
        .error { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
        }
        .loader {
            color: #0056b3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verificador de Ranking</h2>
        <form id="rankingForm">
            <div class="form-group">
                <label for="dni">DNI (sin puntos):</label>
                <input type="text" id="dni" required placeholder="Ej: 38123456" pattern="[0-9]+" title="Solo números, sin puntos">
            </div>
            
            <div class="form-group">
                <label for="promedio">Promedio de la Facultad:</label>
                <input type="text" id="promedio" required placeholder="Ej: 8.5 o 8,5">
            </div>
            
            <div class="form-group">
                <label for="especialidad">Especialidad a la que postulas:</label>
                <select id="especialidad" required>
                    <option value="">Selecciona una especialidad...</option>
                    <!-- Se carga desde JS -->
                </select>
            </div>
            
            <div class="form-group">
                <label for="hospital">Hospital preferido:</label>
                <select id="hospital" required disabled>
                    <option value="">Primero selecciona una especialidad...</option>
                    <!-- Se carga desde JS -->
                </select>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="estudioMendoza">
                <label for="estudioMendoza" style="margin-bottom: 0;">Soy egresado de una facultad en Mendoza</label>
            </div>
            
            <button type="submit">Actualizar Datos y Ver Ranking</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
